apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://acf.cnvos.si"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnvos-acf
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - acf.cnvos.si
      secretName: cnvos-acf-tls
  rules:
    - host: acf.cnvos.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cnvos-acf
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnvos-acf-nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      cnvos-acf-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - files.acf.cnvos.si
      secretName: cnvos-acf-nginx-tls
  rules:
    - host: files.acf.cnvos.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cnvos-acf-nginx
                port:
                  number: 80
