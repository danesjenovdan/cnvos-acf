volumes:
  postgres-data:


services:
  wagtail:
    build: ./acf
    working_dir: /app
    command: ./manage.py runserver 0.0.0.0:8000
    volumes:
      - ./acf:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DATABASE_HOST: db
      DJANGO_DATABASE_NAME: cnvos_acf
      DJANGO_DATABASE_USERNAME: cnvos_acf
      DJANGO_DATABASE_PASSWORD: changeme
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cnvos_acf
      POSTGRES_USER: cnvos_acf
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
